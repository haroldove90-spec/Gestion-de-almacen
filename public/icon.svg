<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Background for PWA -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Inner Subtle Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" />
  
  <!-- Warehouse / Greenhouse Roof Structure -->
  <path d="M 256 86 L 416 196 L 416 386 L 96 386 L 96 196 Z" fill="#022c22" fill-opacity="0.4" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
  
  <!-- Greenhouse Gable Lines -->
  <path d="M 256 86 L 256 386" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>
  <path d="M 176 142 L 176 386" stroke="#34d399" stroke-opacity="0.6" stroke-width="6"/>
  <path d="M 336 142 L 336 386" stroke="#34d399" stroke-opacity="0.6" stroke-width="6"/>
  <path d="M 96 230 L 416 230" stroke="#34d399" stroke-opacity="0.4" stroke-width="6"/>
  
  <!-- Logistics Pallet & Warehouse Stack -->
  <rect x="156" y="270" width="90" height="80" rx="8" fill="url(#accent)" />
  <line x1="201" y1="270" x2="201" y2="350" stroke="#b45309" stroke-width="4" />
  <line x1="156" y1="310" x2="246" y2="310" stroke="#b45309" stroke-width="4" />
  
  <!-- Greenhouse Sprout / Plant Growth in Warehouse -->
  <path d="M 296 350 C 296 280 350 260 370 240 C 370 290 326 310 326 350 Z" fill="#6ee7b7" />
  <path d="M 310 350 C 310 300 270 290 260 270 C 265 320 290 330 290 350 Z" fill="#34d399" />
  
  <!-- Base Floor Foundation -->
  <rect x="130" y="374" width="252" height="18" rx="6" fill="#f8fafc" />
</svg>
